<div class="auth-container">
    <div class="auth-card glass-panel">
        <div class="brand">
            <div class="logo">♪</div>
            <h1>Únete a Amadeus</h1>
            <p>Crea tu cuenta gratis para empezar</p>
        </div>

        <div class="error-alert" *ngIf="errorMessage()">
            {{ errorMessage() }}
        </div>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <div class="input-wrapper">
                    <i class="icon-user">👤</i>
                    <input type="text" id="username" name="username" [ngModel]="username()"
                        (ngModelChange)="username.set($event)" placeholder="Ej. beethoven99" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="icon-mail">✉</i>
                    <input type="email" id="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
                        placeholder="tu@correo.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="icon-lock">🔒</i>
                    <input type="password" id="password" name="password" [ngModel]="password()"
                        (ngModelChange)="password.set($event)" placeholder="Mínimo 8 caracteres" required>
                </div>
            </div>

            <button type="submit" class="btn-primary auth-submit" [disabled]="isLoading()">
                <span *ngIf="!isLoading()">Crear cuenta</span>
                <span *ngIf="isLoading()" class="spinner"></span>
            </button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a></p>
        </div>
    </div>
</div>
