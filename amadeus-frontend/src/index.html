<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>AmadeusFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <app-root></app-root>
  <!-- DEPURACION: Mostrar errores en la propia pantalla -->
  <div id="error-overlay"
    style="position: absolute; top:0; left:0; width:100%; z-index: 9999; color: red; font-family: monospace; padding: 20px; text-align: left;">
  </div>
  <script>
    window.addEventListener('error', function (e) {
      document.getElementById('error-overlay').innerHTML += '<p><strong>ERROR:</strong> ' + e.message + '<br>' + e.filename + ':' + e.lineno + '</p>';
    });
    window.addEventListener('unhandledrejection', function (e) {
      document.getElementById('error-overlay').innerHTML += '<p><strong>PROMISE REJECTION:</strong> ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</p>';
    });
  </script>
</body>

</html>
